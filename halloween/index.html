<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>리드앤라이트 상담</title><style>
:root{--g:#0B3723;--o:#C1A05C}*{box-sizing:border-box}html{background:#f6f3ec;height:100dvh}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f6f3ec;height:100dvh;width:100%;position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}header img{width:40px;height:40px}header b{display:block;font-size:16px}header small{color:var(--o);font-size:12px}
#log{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 40px}.m{max-width:82%;padding:10px 13px;border-radius:16px;margin:6px 0;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:keep-all}
.b{background:#fff;border:1px solid #e4dcc8;border-top-left-radius:4px}.u{background:var(--g);color:#fff;margin-left:auto;border-top-right-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{border:1px solid var(--o);background:#fff;color:var(--g);border-radius:16px;padding:6px 11px;font-size:13px}
form#f{display:flex;gap:6px;padding:8px;background:#fff;border-top:1px solid #ddd}#q{flex:1;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:20px}
.btn{background:var(--g);color:#fff;border:0;border-radius:20px;padding:0 16px;font-size:15px}#lb{background:var(--o);color:var(--g);font-weight:bold;margin:0 8px 8px;padding:11px;border-radius:12px;border:0;font-size:15px}
#lead{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}#lead .p{background:#fff;width:100%;padding:18px;border-radius:16px 16px 0 0}#lead input{width:100%;padding:10px;margin:5px 0;font-size:16px;border:1px solid #ccc;border-radius:8px}
#lead label{font-size:13px;display:flex;gap:6px;margin:8px 0}
footer{flex:none;font-size:10px;line-height:1.45;color:#6d665c;background:#fff;padding:2px 10px 8px;text-align:center}</style></head><body>
<header><img src="logo.png" alt=""><div><b>리드앤라이트영어교습소</b><small>🎃 해피 할로윈 · 무엇이든 물어보세요</small></div></header>
<div id="log"></div><button id="lb" onclick="lead.style.display='flex'">📝 상담 신청 · 무료 레벨테스트</button>
<form id="f"><input id="q" placeholder="궁금한 점을 입력하세요" autocomplete="off"><button class="btn">전송</button></form>
<footer>리드앤라이트영어교습소 · 신고번호 제3-가-05019호 · 교습과목 영어 · 교습비 월 30만~40만원<br>대전 서구 청사서로 11 무지개아파트 상가동 3층 (무료주차) · 평일 12~22시</footer>
<div id="lead"><div class="p"><b>상담 신청</b> <small>(원장님이 직접 연락드려요)</small>
<input id="ln" placeholder="학부모 성함"><input id="lp" placeholder="연락처" inputmode="tel"><input id="lg" placeholder="학생 학년 (예: 고1)"><input id="lm" placeholder="문의 내용 (선택)">
<label><input type="checkbox" id="lc" style="width:auto">[필수] 개인정보 수집·이용 동의: 성함·연락처·학년을 상담 연락 목적으로만 사용하며, 상담 종료 후 1년 내 파기합니다.</label>
<button class="btn" style="width:100%;padding:12px" onclick="sendLead()">신청하기</button><button style="width:100%;margin-top:6px;padding:10px;border:0;background:none" onclick="lead.style.display='none'">닫기</button></div></div>
<script>
const SYS="너는 '리드앤라이트영어교습소'의 온라인 상담 도우미다. 학부모/학생에게 친절하고 짧게(3~5문장) 존댓말 한국어로 답한다.\n[확정 사실 - 이것만 말할 수 있음]\n- 정식명칭: 리드앤라이트영어교습소. 신고번호: 제3-가-05019호. 교습과목: 영어.\n- 위치: 대전 서구 청사서로 11 무지개아파트 상가동 3층, 주차 무료.\n- 운영: 평일 12~22시. 주말·공휴일·명절·빨간날 휴무. 가을방학(휴원) 10/24~10/31. 시험기간에는 추가 보충수업이 있을 수 있음.\n- 전화: 0507-1312-1196만 안내한다. 카카오톡 채널은 언급하지 않는다.\n- 담당: 동욱T(원장). 대상: 중학생·고등학생만. 초등학생은 받지 않음(대기 접수도 하지 않음). 성인반은 안내·모집하지 않음.\n- 수업: 주 2회, 1회 2시간, 정원 9명 이하 소수정예.\n- 구성: 본수업, 단어시험·재시험, 숙제검사, 본문테스트·오답지도.\n- 고등 독해 Trinity: 어휘→구문독해→색깔 코딩으로 핵심문장, 오답 원인 분석.\n- 내신: 학교 실제 기출 분석, 교과서·부교재(올림포스) 변형, 서술형.\n- 교습비: 과정·학년별 월 30만~40만원(교육청 신고 완료). 정확한 금액은 확정하지 말고 원장님이 안내.\n- 현재 반(대략 공개, 빈자리 안내만. 학생 이름·현재 인원수는 절대 말하지 않음): 동대전고2 내신반 수·금 16~18시 / 탄방중1 화·목 16:30~18:30 / 법동중3(내년 고등 진학 대비) 화·목 19~21시 예정. 정원 9명 기준 빈자리 있음. 정확한 자리는 원장님 확인. 남대전고3는 수능(11/19) 이후 종료되므로 홍보·모집 안내하지 않음.\n- 보강: 수업 24시간 전 연락 시 보강 가능. 당일 불참은 보강 불가.\n- 형제할인: 있음. 비율은 원장님이 직접 안내.\n- 레벨테스트: 약 30분. 이벤트 기간(지금 할로윈 캠페인 포함)에는 레테 후 등록할인이 있음(비율은 원장님 안내). 이벤트가 아닐 때는 등록 후 수업 첫날에 진행.\n[규칙]\n1. 질문 유형(교습비/위치/시간/반·빈자리/내신/독해/레벨테스트/보강/휴무/할인/초등/기타)을 스스로 판단해 답한다.\n2. 위 사실에 없는 것(확정 금액, 할인 비율, 예약·자리 확정, 성적 보장, 학생 이름, 인원수)은 절대 확정하지 말고 '원장님이 직접 연락드릴게요'라고 안내하며 화면 아래 '상담 신청'으로 연락처를 권한다. 전화는 0507-1312-1196만.\n3. 초등 문의는 정중히: 현재 중·고등만 운영 중이라 초등은 받지 않으며 대기 접수도 어렵다고 안내. 성인반과 남대전고3는 모집 안내하지 않는다.\n4. 영어 학습 질문(문법 등)은 간단히 도와줘도 된다.\n5. 형제할인과 이벤트 등록할인은 있다까지만 말하고 비율은 원장님이 직접 안내한다고 한다. 그 외 할인·환불은 \"있다/없다\"도 단정하지 말고 원장님이 직접 연락드린다고만 한다. 홈페이지는 없으니 언급하지 않는다. 카카오톡 채널도 언급하지 않는다.\n6. 마크다운 기호 없이 평문으로.";
function fb(q){if(/초등/.test(q))return "죄송해요, 현재 중·고등학생만 운영 중이라 초등학생은 받지 않고 있어요. 대기 접수도 어려워요.";if(/성인/.test(q))return "성인반은 안내하지 않아요. 중·고등 영어만 운영하고 있어요.";if(/남대전/.test(q))return "남대전고3 반은 수능(11/19) 이후 종료되어 모집 안내를 하지 않아요. 다른 학년은 원장님이 직접 확인해 드릴게요. 0507-1312-1196";if(/형제/.test(q))return "형제할인은 있어요. 비율은 원장님이 직접 안내드려요. 0507-1312-1196으로 전화 주세요.";if(/수강료|교습비|비용|얼마|가격|할인/.test(q))return "교습비는 과정·학년에 따라 월 30만~40만원이고, 교육청 신고가 되어 있어요. 정확한 금액과 할인 비율은 원장님이 직접 안내드려요. 전화는 0507-1312-1196이에요.";if(/위치|어디|주차|주소|찾아/.test(q))return "대전 서구 청사서로 11 무지개아파트 상가동 3층이에요. 주차는 무료고, 평일 12~22시에 운영해요.";if(/보강|결석|빠졌|못 가|못가/.test(q))return "수업 24시간 전까지 연락 주시면 보강이 가능해요. 당일 불참은 보강이 어려워요. 0507-1312-1196으로 전화 주세요.";if(/휴무|방학|공휴일|명절|빨간날|주말|휴원/.test(q))return "주말과 공휴일·명절·빨간날은 쉬어요. 가을방학은 10/24~10/31이에요. 시험기간에는 추가 보충수업이 있을 수 있어요.";if(/레벨|레테|테스트/.test(q))return "레벨테스트는 약 30분이에요. 지금 할로윈 캠페인 기간에는 레테 후 등록할인이 있고, 비율은 원장님이 안내드려요. 이벤트 기간이 아니면 등록 후 수업 첫날에 진행해요.";if(/독해|트리니티|Trinity|색깔/.test(q))return "고등 독해는 Trinity예요. 어휘에서 구문독해로 가고, 색깔 코딩으로 핵심문장을 잡은 뒤 오답 원인을 분석해요. 수업은 주 2회, 1회 2시간이고 동욱T(원장)가 담당해요.";if(/내신|올림포스|서술|기출|부교재/.test(q))return "내신은 학교 실제 기출을 분석하고, 교과서·부교재(올림포스) 변형과 서술형을 대비해요. 반 배정이 필요하면 원장님이 직접 확인해 주세요. 0507-1312-1196";if(/시간|반 |수업|정원|동대전|탄방|법동|빈자리/.test(q))return "수업은 주 2회, 1회 2시간, 정원 9명 이하 소수정예이고 동욱T(원장)가 담당해요. 본수업, 단어시험·재시험, 숙제검사, 본문테스트·오답지도로 구성돼요. 지금은 동대전고2 내신반(수·금 16~18시), 탄방중1(화·목 16:30~18:30), 법동중3(화·목 19~21시 예정, 내년 고등 대비)을 안내하고, 정원 9명 기준 빈자리는 있어요. 정확한 자리는 원장님이 확인해 주세요. 0507-1312-1196";return "자세한 내용은 원장님이 직접 연락드릴게요. 아래 '상담 신청'으로 연락처를 남겨주시거나 0507-1312-1196로 전화 주세요."}
async function callAI(){for(let i=0;i<2;i++){try{const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:SYS}].concat(msgs.slice(-12))})});const j=await r.json();const t=(j.choices[0].message.content||'').trim();if(t)return t}catch(e){}}return fb(msgs[msgs.length-1].content)}
const sid=crypto.randomUUID?crypto.randomUUID():String(Math.random()),msgs=[],L=document.getElementById('log');
function scrollBottom(){requestAnimationFrame(function(){var last=L.lastElementChild;if(last&&last.scrollIntoView)last.scrollIntoView({block:'end'});L.scrollTop=L.scrollHeight})}
function fitVV(){var vv=window.visualViewport;if(!vv)return;document.body.style.height=vv.height+'px';document.body.style.top=vv.offsetTop+'px'}
function onVV(){fitVV();scrollBottom()}
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;L.appendChild(d);scrollBottom();return d}
add('🍬 할로윈 캔디 받고 오셨군요! 반가워요.\n리드앤라이트영어교습소 상담 도우미예요. 수업, 수강료, 위치, 내신 대비 등 무엇이든 편하게 물어보세요.','b');
const ch=document.createElement('div');ch.className='chips';['수강료가 궁금해요','위치·주차','고1 내신 대비','레벨테스트 받고 싶어요'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>ask(t);ch.appendChild(b)});L.appendChild(ch);
async function ask(t){if(!t.trim())return;add(t,'u');msgs.push({role:'user',content:t});const w=add('답변 작성 중…','b');
const a=await callAI();w.textContent=a;msgs.push({role:'assistant',content:a});scrollBottom()}
f.onsubmit=e=>{e.preventDefault();const t=q.value;q.value='';ask(t)};
q.addEventListener('focus',onVV);
window.addEventListener('resize',onVV);
if(window.visualViewport){visualViewport.addEventListener('resize',onVV);visualViewport.addEventListener('scroll',fitVV)}
fitVV();
async function sendLead(){if(!lc.checked)return alert('개인정보 수집·이용에 동의해 주세요.');if(!lp.value.trim())return alert('연락처를 입력해 주세요.');
const a=JSON.parse(localStorage.getItem('rw_leads')||'[]');a.push({sid,name:ln.value,phone:lp.value,grade:lg.value,memo:lm.value,ts:new Date().toISOString()});localStorage.setItem('rw_leads',JSON.stringify(a));lead.style.display='none';add('신청 완료! 원장님이 직접 연락드릴게요. 🎃\n급하시면 0507-1312-1196로 전화 주세요.\n(시제품: 신청 내용은 이 기기에만 저장돼요. 서버 저장은 추후 연동 예정)','b')}
</script></body></html>
